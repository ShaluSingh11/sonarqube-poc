# Unique identifier for this project on the SonarQube server.
sonar.projectKey=sonarqube-poc

# Human-readable name shown on the dashboard.
sonar.projectName=SonarQube POC - Employee Management App

# SonarQube server.
sonar.host.url=http://localhost:9000

# Source code to analyze.
sonar.sources=backend/src,backend/index.js,frontend/src

# Test locations.
sonar.tests=backend/tests,frontend/tests,backend/src,frontend/src

# Jest test file naming conventions.
sonar.test.inclusions=**/*.test.js,**/*.spec.js

# Files/folders to exclude.
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**

# LCOV coverage reports.
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info
